 add(2,.55,4.4,paint,0,.78,0);add(1.9,.3,1.3,paint,0,1.1,1.5).rotation.x=-.2;

 const hl=new T.MeshBasicMaterial({color:0xfff4c8}),tl=new T.MeshBasicMaterial({color:0xff1a1a});
 [-.68,.68].forEach(x=>{add(.45,.18,.06,hl,x,.9,2.22);add(.45,.16,.06,tl,x,.92,-2.22);const gn=new T.Mesh(new T.CylinderGeometry(.06,.06,1,8),dk);gn.rotation.x=Math.PI/2;gn.position.set(x*.9,.95,2.1);b.add(gn)});
 const wh=[],wg=new T.CylinderGeometry(.46,.46,.36,22);wg.rotateZ(Math.PI/2);const rg=new T.CylinderGeometry(.27,.27,.38,10);rg.rotateZ(Math.PI/2);

// audio

function drive(c,dt,thr,str,nit){const f0=c.vx*Math.sin(c.h)+c.vz*Math.cos(c.h);

 const fx=Math.sin(c.h),fz=Math.cos(c.h),rx=Math.cos(c.h),rz=-Math.sin(c.h);
 let f=c.vx*fx+c.vz*fz,l=c.vx*rx+c.vz*rz;const mx=(c.top||34)*(nit?1.5:1);
 let a=thr>0?thr*(nit?80:40):thr*55;if(f>mx&&thr>0)a=0;if(f<-14&&thr<0)a=0;f+=a*dt;f*=1-dt*(thr===0?.9:.12);l*=Math.exp(-dt*5);

let last=performance.now(),pcd=0;
