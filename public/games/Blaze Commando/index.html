<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=540,GY=430;
cv.width=W;cv.height=H;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=1;const R=()=>(seed=seed*16807%2147483647)/2147483647;
const HEROES=[{n:'BILL',skin:'#f2c9a0',pants:'#2b4ca0',band:'#e63232',hair:'#3a2412'},{n:'LANCE',skin:'#e0aa80',pants:'#b02a2a',band:'#ffd23b',hair:'#111'}];
const THEMES=[
 {s0:'#0b1f2a',s1:'#e8914a',m:'#233a4d',t:'#0f3b24',gr:'#4cb035',d:'#4a2f18',w:'#1b6aa8'},
 {s0:'#14061f',s1:'#6b2a6e',m:'#2a1646',t:'#1d2b3a',gr:'#6ad48a',d:'#2d2a3a',w:'#3a1f7a'},
 {s0:'#2a1235',s1:'#ffb25e',m:'#6e3d4f',t:'#4a2a2a',gr:'#d9a25b',d:'#6b4a2a',w:'#2a7fa0'}];
const WN={N:'NORMAL',S:'SPREAD',M:'MACHINE',R:'LASER'};
/* ---------- input ---------- */
const down={},buf={jump:0};
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyJ:'fire',KeyZ:'fire',KeyL:'fire',KeyK:'jump',KeyX:'jump',Space:'jump'};
function press(n,on){down[n]=on;if(on&&n==='jump')buf.jump=8}
addEventListener('keydown',e=>{const n=KM[e.code];
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')state='pause';else if(state==='pause')state='play';return}
  if(state==='menu'){if(n==='left')sel=(sel+1)%2;if(n==='right')sel=(sel+1)%2;if(e.code==='Enter'||e.code==='Space'||n==='fire')begin();if(n||e.code==='Enter')e.preventDefault();return}
  if(state==='over'){if(e.code==='Enter'||e.code==='Space'||n==='fire')state='menu';e.preventDefault();return}
  if(n){e.preventDefault();if(!e.repeat)press(n,true)}});
addEventListener('keyup',e=>{const n=KM[e.code];if(n)down[n]=false});
document.querySelectorAll('#pad b').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='over'){state='menu';return}press(k,true)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>down[k]=false))});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(state==='menu'){if(y>=490)begin();else if(y>=225)sel=x<480?0:1}else if(state==='over')state='menu'});
/* ---------- audio ---------- */
let ac;const AC=()=>ac=ac||new(window.AudioContext||window.webkitAudioContext)();
function nz(len,vol,f0,f1,type='lowpass'){try{const a=AC(),n=a.sampleRate*len|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type=type;f.frequency.setValueAtTime(f0,a.currentTime);f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+len);g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function tn(f0,f1,len,vol,ty='sine',d=0){try{const a=AC(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+d;o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len)}catch(e){}}
let sfxT=0;
const SFX={shot:()=>{if(tick-sfxT<3)return;sfxT=tick;tn(900,180,.07,.07,'square')},hit:()=>tn(220,90,.06,.12,'square'),boom:()=>{nz(.3,.5,1400,80);tn(140,40,.3,.4)},big:()=>{nz(.6,.7,1000,50);tn(100,30,.6,.5,'sawtooth')},
 jump:()=>tn(280,560,.12,.09,'square'),die:()=>{tn(500,40,.6,.25,'sawtooth');nz(.4,.4,900,60)},pick:()=>{tn(600,900,.1,.12,'square');tn(900,1400,.12,.12,'square',.09)},splash:()=>nz(.25,.3,900,200)};
/* ---------- state ---------- */
let state='menu',sel=0,tick=0,cam=0,camMax=0,L=0,lvl=0,gaps=[],plats=[],sp=[],spi=0,en=[],bl=[],eb=[],fx=[],it=[],score=0,lives=3,P=null,shake=0,clearT=0,best=0,bossE=null,nextLife=20000,theme=THEMES[0],stageT=0,flashT=0;
try{best=+localStorage.getItem('bcBest')||0}catch(e){}
const inGap=x=>gaps.some(g=>x>g.x+4&&x<g.x+g.w-4);
function safeX(x){for(let i=0;i<40;i++){if(!gaps.some(g=>x>g.x-30&&x<g.x+g.w+30))return x;x+=40}return x}
function genLevel(n){
 seed=77+n*131;theme=THEMES[n%3];L=5200+n*600;camMax=L-W;gaps=[];plats=[];sp=[];spi=0;
 for(let x=850;x<L-1400;){const w=62+(R()*32|0);gaps.push({x,w});x+=w+380+(R()*330|0)}
 for(let x=350;x<L-900;x+=420+(R()*300|0)){const w=130+(R()*90|0);plats.push({x,w,y:350});if(R()<.6)plats.push({x:x+30,w:Math.max(70,w-80),y:270})}
 const dens=Math.max(110,230-n*20);
 for(let x=650;x<L-900;x+=dens+(R()*dens|0)){const sx=safeX(x);
   if(R()<.55){const c=Math.min(4,1+(R()*(2+n/2)|0));for(let i=0;i<c;i++)sp.push({x:safeX(sx+i*46),t:'run'})}
   else sp.push({x:sx,t:'turret'})}
 plats.forEach(q=>{if(R()<.5+n*.08)sp.push({x:q.x+q.w/2,y:q.y,t:'sniper'})});
 for(let x=1000;x<L-1200;x+=950+(R()*500|0))sp.push({x,t:'cap'});
 sp.push({x:L-760,t:'boss'});sp.sort((a,b)=>a.x-b.x)}
function mkP(){return{x:cam+90,y:-30,vx:0,vy:0,g:0,dir:1,jump:0,drop:0,dead:0,dt:0,inv:150,cd:0,wp:'N',anim:0,spin:0,prone:0,ax:1,ay:0,cfg:HEROES[sel]}}
function begin(){goFS();try{AC()}catch(e){}lvl=0;genLevel(0);cam=0;en=[];bl=[];eb=[];fx=[];it=[];score=0;lives=3;nextLife=20000;bossE=null;clearT=0;P=mkP();P.x=80;P.inv=120;stageT=150;state='play'}
function nextLevel(){lvl++;genLevel(lvl);cam=0;en=[];bl=[];eb=[];it=[];fx=[];bossE=null;const w=P.wp;P=mkP();P.wp=w;P.x=80;P.inv=150;stageT=150}
function respawn(){P=mkP();P.x=safeX(cam+110);P.y=-40;P.inv=150}
function endGame(){state='over';if(score>best){best=score;try{localStorage.setItem('bcBest',best)}catch(e){}}}
/* ---------- physics ---------- */
function surf(x,fy,py,drop){let b=null;
 if(!inGap(x)&&py<=GY+8&&fy>=GY)b=GY;
 if(!drop)for(const q of plats)if(x>=q.x&&x<=q.x+q.w&&py<=q.y+1&&fy>=q.y&&(b===null||q.y<b))b=q.y;
 return b}
function moveY(e){const py=e.y;e.vy+=.5;if(e.vy>14)e.vy=14;e.y+=e.vy;e.g=0;if(e.vy>=0){const s=surf(e.x,e.y,py,e.drop>0);if(s!==null){e.y=s;e.vy=0;e.g=1}}}
const box=e=>e.t==='run'?[e.x-9,e.y-38,e.x+9,e.y]:e.t==='sniper'?[e.x-10,e.y-40,e.x+10,e.y]:e.t==='turret'?[e.x-18,e.y-32,e.x+18,e.y]:e.t==='cap'?[e.x-16,e.y-10,e.x+16,e.y+10]:[e.x-55,e.y-230,e.x+55,e.y];
const pbox=p=>p.prone?[p.x-17,p.y-14,p.x+17,p.y]:(p.jump&&!p.g)?[p.x-8,p.y-30,p.x+8,p.y-6]:[p.x-6,p.y-36,p.x+6,p.y];
const ov=(a,b)=>a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1];
const bs=()=>Math.min(2.6+lvl*.25,4.6);
/* ---------- fx ---------- */
function boom(x,y,n){fx.push({k:'e',x,y,t:0,l:22,r:14+n*10});for(let i=0;i<n*3;i++){const a=Math.random()*6.28,v=1+Math.random()*4;fx.push({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,l:14+Math.random()*10})}}
function spark(x,y){for(let i=0;i<3;i++)fx.push({k:'s',x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,t:0,l:8})}
function splash(x){SFX.splash();for(let i=0;i<10;i++)fx.push({k:'w',x,y:GY,vx:(Math.random()-.5)*3,vy:-2-Math.random()*4,t:0,l:26})}
/* ---------- combat ---------- */
function gunPos(p){if(p.jump&&!p.g)return[p.x+p.ax*18,p.y-18+p.ay*18];if(p.prone)return[p.x+8*p.dir+p.ax*25,p.y-7];return[p.x+p.ax*25,p.y-30+p.ay*25]}
function mb(x,y,a,spd,d,w,l){bl.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,l:l||70,d,w})}
function shoot(p){const[gx,gy]=gunPos(p),a=Math.atan2(p.ay,p.ax),w=p.wp;
 fx.push({k:'m',x:gx,y:gy,t:0,l:4});SFX.shot();
 if(w==='N'){mb(gx,gy,a,9,1,'N');p.cd=11}
 else if(w==='M'){mb(gx,gy,a+(Math.random()-.5)*.1,10,1,'M');p.cd=5}
 else if(w==='S'){for(let i=-2;i<=2;i++)mb(gx,gy,a+i*.2,8.5,1,'S',55);p.cd=15}
 else{mb(gx,gy,a,14,2,'R',60);p.cd=9}}
function aimShot(x,y,spd,spread){if(P.dead)return;const a=Math.atan2(P.y-24-y,P.x-x)+(Math.random()-.5)*(spread===undefined?.12:spread);eb.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,l:360})}
function fan(x,y,spd,n,gap){if(P.dead)return;const a=Math.atan2(P.y-24-y,P.x-x);for(let i=0;i<n;i++){const g=a+(i-(n-1)/2)*gap;eb.push({x,y,vx:Math.cos(g)*spd,vy:Math.sin(g)*spd,l:360})}}
function die(){if(P.dead||P.inv>0)return;P.dead=1;P.dt=0;P.vy=-8;P.vx=-P.dir*2.5;SFX.die;SFX.die();shake=9;boom(P.x,P.y-18,1)}
function hitE(e,d){e.hp-=d;e.fl=4;if(e.hp<=0)killE(e);else SFX.hit()}
function killE(e){
 if(e.t==='boss'){e.dying=150;e.hp=0;eb=[];score+=500;SFX.big();en.forEach(o=>{if(o!==e&&!o.dead){o.dead=1;boom(o.x,o.y-20,1)}});return}
 e.dead=1;if(e.t==='run'){score+=100;boom(e.x,e.y-20,1)}else if(e.t==='sniper'){score+=200;boom(e.x,e.y-20,1)}else if(e.t==='turret'){score+=300;boom(e.x,e.y-16,2)}
 else{score+=200;boom(e.x,e.y,1);const T='SSRMBMRSL';it.push({x:e.x,y:e.y,vy:-4,vx:0,g:0,k:T[Math.random()*T.length|0],age:0})}
 SFX.boom()}
function spawnE(s){const e={t:s.t,x:s.x,y:s.y!==undefined?s.y:GY,vx:0,vy:0,g:1,dir:-1,anim:0,fl:0,cd:50+Math.random()*60,hp:1,b:0,sp:Math.min(1.5+lvl*.12,2.6)+Math.random()*.4};
 if(s.t==='run')e.shoot=Math.random()<.3+lvl*.1;
 else if(s.t==='sniper'){e.hp=2}
 else if(s.t==='turret'){e.hp=5+(lvl>>1)}
 else if(s.t==='cap'){e.x=cam+W+20;e.y0=110+Math.random()*130;e.y=e.y0;e.vx=-1.7}
 else if(s.t==='boss'){e.x=L-110;e.hp=e.max=60+lvl*25;e.cd=90;e.sc=150;e.ph=0;e.dying=0;bossE=e}
 en.push(e)}
function upE(e){
 if(e.fl>0)e.fl--;
 const on=e.x>cam-40&&e.x<cam+W+40,dx=P.x-e.x;
 if(e.t==='run'){
  e.dir=dx>0?1:-1;
  if(e.g){e.vx=e.dir*e.sp;if(on&&Math.abs(dx)<350&&Math.random()<.007){e.vy=-8.6;e.g=0}}
  e.x+=e.vx;moveY(e);e.anim+=.2*e.sp;
  if(e.shoot&&on&&e.g&&--e.cd<=0){aimShot(e.x+e.dir*12,e.y-26,bs());e.cd=110+Math.random()*90}
  if(e.y>GY+70){splash(e.x);e.dead=1}else if(e.x<cam-200)e.dead=1}
 else if(e.t==='sniper'){e.dir=dx>0?1:-1;if(on&&--e.cd<=0){aimShot(e.x,e.y-30,bs());e.cd=Math.max(55,110-lvl*8)+Math.random()*40}}
 else if(e.t==='turret'){if(on&&--e.cd<=0){aimShot(e.x,e.y-20,bs(),.05);e.b=(e.b+1)%2;e.cd=e.b?10:Math.max(60,120-lvl*8)}}
 else if(e.t==='cap'){e.x+=e.vx;e.y=e.y0+Math.sin(tick*.06)*30;if(e.x<cam-60)e.dead=1}
 else if(e.t==='boss'){
  if(e.dying){e.dying--;if(e.dying%5===0)boom(e.x-50+Math.random()*100,e.y-Math.random()*220,1);shake=6;if(e.dying===0){e.dead=1;score+=3000+lvl*1000;clearT=260;SFX.big()}return}
  if(cam<camMax-100)return;
  const fast=e.hp<e.max/2;
  if(--e.cd<=0){e.ph^=1;if(e.ph)fan(e.x-60,e.y-170,bs(),3,.28);else fan(e.x-60,e.y-90,bs(),3,.28);e.cd=fast?50:80}
  if(--e.sc<=0){spawnE({t:'run',x:e.x-40});e.sc=fast?200:300}}}
function upP(){const p=P;
 if(p.dead){p.dt++;p.vy+=.5;p.y+=p.vy;p.x+=p.vx;if(p.dt>80){lives--;if(lives<=0)endGame();else respawn()}return}
 if(p.inv>0)p.inv--;if(buf.jump>0)buf.jump--;
 const mx=(down.right?1:0)-(down.left?1:0),up=down.up,dn=down.down;
 p.prone=!!(p.g&&dn&&!mx&&!up);
 if(mx&&!p.prone)p.dir=mx;
 if(p.g){p.vx=p.prone?0:mx*2.6;if(mx)p.anim+=.3}else p.vx=mx?mx*2.6:p.vx*.92;
 p.x+=p.vx;p.x=cl(p.x,cam+12,cam+W-12);
 if(bossE&&!bossE.dead)p.x=Math.min(p.x,bossE.x-70);
 if(buf.jump>0&&p.g){if(dn&&p.y<GY-1){p.drop=14;p.y+=2;p.g=0;p.vy=1}else{p.vy=-9.6;p.g=0;p.jump=1;SFX.jump()}buf.jump=0}
 if(!down.jump&&p.vy<-3.5&&p.jump)p.vy=-3.5;
 moveY(p);if(p.g)p.jump=0;if(p.drop>0)p.drop--;
 if(p.jump&&!p.g)p.spin+=.45*p.dir;
 if(p.y>GY+60){p.dead=1;p.dt=40;p.vy=0;p.vx=0;splash(p.x);return}
 let ax=p.dir,ay=0;
 if(up){ay=-1;if(!mx)ax=0}else if(dn&&!p.prone){ay=1;if(!mx)ax=0}
 const ln=Math.hypot(ax,ay)||1;p.ax=ax/ln;p.ay=ay/ln;
 if(p.cd>0)p.cd--;
 if(down.fire&&p.cd<=0)shoot(p)}
function update(){
 tick++;
 if(state!=='play')return;
 shake*=.85;if(stageT>0)stageT--;if(flashT>0)flashT--;
 if(clearT>0&&--clearT===0){nextLevel();return}
 upP();
 if(!P.dead)cam=cl(Math.max(cam,P.x-W*.4),0,camMax);
 while(spi<sp.length&&cam+W+40>=sp[spi].x)spawnE(sp[spi++]);
 en.forEach(upE);
 bl=bl.filter(b=>{b.x+=b.vx;b.y+=b.vy;if(--b.l<=0||b.x<cam-60||b.x>cam+W+60||b.y<-60||b.y>H+60)return false;
  for(const e of en){if(e.dead||e.dying)continue;const q=box(e);if(b.x>q[0]&&b.x<q[2]&&b.y>q[1]&&b.y<q[3]){hitE(e,b.d);spark(b.x,b.y);return false}}
  return true});
 const pb=pbox(P);
 eb=eb.filter(b=>{b.x+=b.vx;b.y+=b.vy;if(--b.l<=0||b.x<cam-60||b.x>cam+W+60||b.y<-60||b.y>H+60)return false;
  if(!P.dead&&P.inv<=0&&b.x>pb[0]&&b.x<pb[2]&&b.y>pb[1]&&b.y<pb[3]){die();return false}return true});
 if(!P.dead&&P.inv<=0)for(const e of en){if(e.dead||e.dying||e.t==='cap'||e.t==='boss')continue;if(ov(box(e),pb)){die();break}}
 en=en.filter(e=>!e.dead);
 it=it.filter(i=>{i.age++;i.y+=0;i.vy+=.3;const py=i.y;i.y+=i.vy;i.g=0;if(i.vy>=0){const s=surf(i.x,i.y,py,false);if(s!==null){i.y=s;i.vy=0;i.g=1}}
  if(!P.dead&&Math.abs(i.x-P.x)<22&&Math.abs((i.y-12)-(P.y-20))<28){
   if(i.k==='B'){P.inv=480}else if(i.k==='L'){lives++}else P.wp=i.k;SFX.pick();score+=50;return false}
  return i.age<900&&i.y<GY+80});
 fx=fx.filter(f=>{f.t++;if(f.vx!==undefined){f.x+=f.vx;f.y+=f.vy;if(f.k==='s'||f.k==='w')f.vy+=.2}return f.t<f.l});
 if(score>=nextLife){lives++;nextLife+=20000;SFX.pick()}}
/* ---------- drawing: background ---------- */
const mtn=wx=>90+Math.sin(wx*.006)*50+Math.sin(wx*.017+2)*25;
function drawBG(c){
 const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,theme.s0);g.addColorStop(1,theme.s1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,240,200,.8)';ctx.beginPath();ctx.arc(720,140,44,0,6.3);ctx.fill();
 ctx.fillStyle=theme.m;ctx.beginPath();ctx.moveTo(0,GY);for(let x=0;x<=W+40;x+=40)ctx.lineTo(x,GY-mtn(x+c*.15)-40);ctx.lineTo(W+40,GY);ctx.fill();
 ctx.fillStyle=theme.t;
 const i0=Math.floor(c*.5/170)-1;
 for(let i=i0;i<i0+8;i++){const h=((i*9301+49297)%233)/233,sx=i*170-c*.5+((i*37)%50),th=130+h*90;
  ctx.beginPath();ctx.moveTo(sx-6,GY);ctx.lineTo(sx+6,GY);ctx.lineTo(sx+3,GY-th);ctx.lineTo(sx-3,GY-th);ctx.fill();
  for(let k=0;k<5;k++){const a=-.3+k*.8+Math.PI;ctx.beginPath();ctx.ellipse(sx+Math.cos(a)*30,GY-th+Math.sin(a)*14+8,34,8,Math.cos(a)*.6,0,6.3);ctx.fill()}}
 ctx.fillStyle=theme.d;ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='rgba(0,0,0,.18)';for(let y=GY+30;y<H;y+=24)ctx.fillRect(0,y,W,3);
 ctx.fillStyle=theme.gr;ctx.fillRect(0,GY,W,10);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,GY+10,W,4);
 for(const q of gaps){const x=q.x-c;if(x>W||x+q.w<0)continue;
  ctx.fillStyle=theme.w;ctx.fillRect(x,GY,q.w,H-GY);ctx.fillStyle='rgba(255,255,255,.25)';

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function man(x,y,dir,o){
 ctx.save();ctx.translate(x,y);const F=c=>o.fl?'#fff':c;
 if(o.spin!==undefined){ctx.translate(0,-18);ctx.rotate(o.spin);
  ctx.fillStyle=F(o.pants);ctx.fillRect(-9,0,18,9);ctx.fillStyle=F(o.shirt||o.skin);ctx.beginPath();ctx.arc(0,-2,10,0,6.3);ctx.fill();
  ctx.fillStyle=F(o.skin);ctx.beginPath();ctx.arc(7,-8,6,0,6.3);ctx.fill();ctx.fillStyle=F(o.band||'#c33');ctx.fillRect(2,-12,11,3);ctx.restore();return}
 ctx.save();ctx.scale(dir,1);
 if(o.prone){
  ctx.fillStyle=F(o.pants);ctx.fillRect(-20,-8,16,7);ctx.fillStyle=F(o.shirt||o.skin);ctx.fillRect(-6,-10,18,9);
  ctx.fillStyle=F(o.skin);ctx.beginPath();ctx.arc(15,-9,6,0,6.3);ctx.fill();ctx.fillStyle=F(o.band);ctx.fillRect(9,-14,13,3);ctx.fillRect(4,-13,6,2);
 }else{
  const s=o.run?Math.sin(o.anim):0;let f1,f2;

  ctx.strokeStyle=F(o.pants);ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-2,-18);ctx.lineTo(f2[0],f2[1]-1);ctx.moveTo(2,-18);ctx.lineTo(f1[0],f1[1]-1);ctx.stroke();
  ctx.fillStyle=F('#1a1a1a');[f1,f2].forEach(f=>ctx.fillRect(f[0]-3,f[1]-3,8,4));
  ctx.fillStyle=F(o.shirt||o.skin);ctx.fillRect(-6,-37,12,19);ctx.fillStyle=F('#3a2a1a');ctx.fillRect(-6,-21,12,3);
  ctx.fillStyle=F(o.skin);ctx.beginPath();ctx.arc(1,-43,6.5,0,6.3);ctx.fill();

  ctx.fillStyle='#111';ctx.fillRect(4,-44,2,2)}
 ctx.restore();
 const sx=o.prone?8*dir:0,sy=o.prone?-7:-30;
 ctx.lineCap='round';ctx.strokeStyle=F(o.skin);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+o.ax*10,sy+o.ay*10);ctx.stroke();
 ctx.strokeStyle=F('#222');ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sx+o.ax*8,sy+o.ay*8);ctx.lineTo(sx+o.ax*25,sy+o.ay*25);ctx.stroke();
 ctx.restore()}

 if(p.dead){man(p.x-cam,p.y,p.dir,{skin:c.skin,pants:c.pants,band:c.band,spin:p.dt*.35,ax:1,ay:0});return}
 if(p.inv>0&&p.inv<=150&&(tick>>2)%2)return;
 man(p.x-cam,p.y,p.dir,{skin:c.skin,pants:c.pants,band:c.band,hair:c.hair,anim:p.anim,run:p.g&&p.vx!==0,prone:p.prone,fall:!p.g&&!p.jump,spin:(p.jump&&!p.g)?p.spin:undefined,ax:p.ax,ay:p.ay});

function drawE(e){const x=e.x-cam;if(x<-120||x>W+120)return;

 else if(e.t==='sniper'){const a=Math.atan2(P.y-24-(e.y-30),P.x-e.x);man(x,e.y,e.dir,{skin:'#e2b48c',pants:'#2a2a44',shirt:'#3a3a6b',helmet:'#222a55',ax:Math.cos(a),ay:Math.sin(a),fl:e.fl>0})}
 else if(e.t==='turret'){const a=Math.atan2(P.y-24-(e.y-20),P.x-e.x),F=c=>e.fl>0?'#fff':c;
  ctx.fillStyle=F('#4a5260');ctx.fillRect(x-22,e.y-16,44,16);ctx.fillStyle=F('#2d333d');ctx.fillRect(x-22,e.y-6,44,6);
  ctx.strokeStyle=F('#22262e');ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,e.y-20);ctx.lineTo(x+Math.cos(a)*28,e.y-20+Math.sin(a)*28);ctx.stroke();
  ctx.fillStyle=F('#6a7484');ctx.beginPath();ctx.arc(x,e.y-18,14,Math.PI,0);ctx.fill();ctx.fillStyle=(tick>>3)%2?'#f33':'#611';ctx.fillRect(x-3,e.y-26,6,4)}
 else if(e.t==='cap'){const F=c=>e.fl>0?'#fff':c;ctx.strokeStyle=F('#9aa5b1');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-26,e.y-8);ctx.lineTo(x-10,e.y);ctx.moveTo(x+26,e.y-8);ctx.lineTo(x+10,e.y);ctx.stroke();
  ctx.fillStyle=F('#cfd8dc');ctx.beginPath();ctx.ellipse(x,e.y,17,10,0,0,6.3);ctx.fill();ctx.fillStyle=F('#e63232');ctx.beginPath();ctx.arc(x,e.y,5,0,6.3);ctx.fill()}
 else drawBoss(e,x)}
function drawBoss(e,x){const y=e.y,F=c=>e.fl>0?'#fff':c,sh=e.dying?(Math.random()-.5)*6:0;ctx.save();ctx.translate(sh,0);
 ctx.fillStyle=F('#2b3340');ctx.fillRect(x-55,y-230,110,230);ctx.fillStyle=F('#3a4452');ctx.fillRect(x-55,y-230,12,230);ctx.fillRect(x-65,y-240,130,16);
 ctx.fillStyle='#1b2029';for(let i=0;i<5;i++)ctx.fillRect(x-35+(i%2)*40,y-215+i*8,20,4);
 const a1=Math.atan2(P.y-24-(y-170),P.x-(x-55)),a2=Math.atan2(P.y-24-(y-90),P.x-(x-55));
 ctx.lineCap='round';ctx.strokeStyle=F('#171b22');ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x-55,y-170);ctx.lineTo(x-55+Math.cos(a1)*34,y-170+Math.sin(a1)*34);ctx.moveTo(x-55,y-90);ctx.lineTo(x-55+Math.cos(a2)*34,y-90+Math.sin(a2)*34);ctx.stroke();
 ctx.fillStyle=F('#566073');ctx.beginPath();ctx.arc(x-55,y-170,12,0,6.3);ctx.arc(x-55,y-90,12,0,6.3);ctx.fill();
 const pul=1+Math.sin(tick*.2)*.15;ctx.fillStyle='#400';ctx.beginPath();ctx.arc(x-5,y-130,26,0,6.3);ctx.fill();ctx.fillStyle=e.fl>0?'#fff':'#ff3b2f';ctx.beginPath();ctx.arc(x-5,y-130,20*pul,0,6.3);ctx.fill();ctx.fillStyle='#ffd0a0';ctx.beginPath();ctx.arc(x-9,y-134,7,0,6.3);ctx.fill();
 ctx.fillStyle='#0b0d12';ctx.fillRect(x-30,y-58,42,58);ctx.fillStyle='#ffb347';ctx.fillRect(x-28,y-56,38,3);
 ctx.restore()}
function drawIt(){for(const i of it){const x=i.x-cam;if(x<-30||x>W+30)continue;if(i.age>700&&(tick>>2)%2)continue;
  const y=i.y-12+Math.sin(i.age*.12)*2;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,i.y,10,3,0,0,6.3);ctx.fill();
  ctx.fillStyle=i.k==='L'?'#7dff7d':i.k==='B'?'#6fd0ff':'#ffd23b';ctx.beginPath();ctx.arc(x,y,12,0,6.3);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  txt(i.k,x,y+7,18,'#222','center',0)}}
function drawBul(){
 for(const b of bl){const x=b.x-cam;
  if(b.w==='R'){ctx.strokeStyle='#7df9ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,b.y);ctx.lineTo(x-b.vx*1.6,b.y-b.vy*1.6);ctx.stroke()}
  else if(b.w==='S'){ctx.fillStyle='#ff8a2b';ctx.beginPath();ctx.arc(x,b.y,4,0,6.3);ctx.fill();ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(x,b.y,2,0,6.3);ctx.fill()}

 for(const b of eb){const x=b.x-cam;ctx.fillStyle='#ff3b78';ctx.beginPath();ctx.arc(x,b.y,5,0,6.3);ctx.fill();ctx.fillStyle='#ffd0e0';ctx.beginPath();ctx.arc(x,b.y,2.2,0,6.3);ctx.fill()}}

  if(f.k==='e'){const r=f.r*(.4+f.t/f.l*.8);ctx.globalAlpha=a;ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.arc(x,f.y,r,0,6.3);ctx.fill();ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(x,f.y,r*.55,0,6.3);ctx.fill();ctx.globalAlpha=1}

 for(let i=0;i<Math.min(lives,8);i++){ctx.fillStyle=P.cfg.skin;ctx.beginPath();ctx.arc(30+i*24,34,9,0,6.3);ctx.fill();ctx.fillStyle=P.cfg.band;ctx.fillRect(21+i*24,28,18,4);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(30+i*24,34,9,0,6.3);ctx.stroke()}

 if(bossE&&!bossE.dead&&cam>=camMax-300){const w=300,x=W/2-w/2;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x-3,57,w+6,16);ctx.fillStyle='#3a1414';ctx.fillRect(x,60,w,10);ctx.fillStyle='#ff3b2f';ctx.fillRect(x,60,w*cl(bossE.hp/bossE.max,0,1),10);txt('FORTRESS',W/2,92,18,'#fff','center')}

 const g=ctx.createLinearGradient(0,50,0,125);g.addColorStop(0,'#ffd23b');g.addColorStop(1,'#ff4a1a');ctx.globalAlpha=.9;txt('BLAZE COMMANDO',W/2,115,92,g,'center',0);ctx.globalAlpha=1;
 txt('RUN & GUN SHOOTER',W/2,158,28,'#7df9ff','center');
 txt('CHOOSE YOUR COMMANDO',W/2,214,24,'#fff','center');
 HEROES.forEach((h,i)=>{const on=i===sel,x=360+i*240;
  ctx.fillStyle=on?'#ffd23b':'#555';rr(x-100,228,200,230,14);ctx.fillStyle=on?'rgba(40,18,20,.95)':'rgba(10,5,12,.85)';rr(x-97,231,194,224,12);
  ctx.globalAlpha=on?1:.65;man(x-4,405,1,{skin:h.skin,pants:h.pants,band:h.band,hair:h.hair,ax:1,ay:0,anim:0,run:0});
  if(on&&(tick>>3)%3===0){ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.arc(x+21,375,6,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;txt(h.n,x,440,on?30:24,on?'#ffd23b':'#aaa','center')});
 txt('◀ ▶ choose  •  Move: Arrows/WASD  •  Shoot: J/Z  •  Jump: K/X/Space',W/2,478,15,'#ddd','center');
 ctx.fillStyle='#ffd23b';rr(W/2-150,490,300,40,10);ctx.fillStyle=(tick>>5)%2?'#ff6a1a':'#d6501a';rr(W/2-147,493,294,34,8);txt('START  ▶',W/2,520,26,'#fff','center');
 if(best)txt('BEST '+best,W-24,34,22,'#ffd23b','right')}
function draw(){
 ctx.save();if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 if(state==='menu')drawMenu();
 else{drawBG(cam);drawPlats();drawIt();en.forEach(drawE);drawP();drawBul();waterOverlay();drawFX();drawHUD();
  if(state==='pause'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,270,70,'#fff','center');txt('Press P to resume',W/2,320,26,'#ffd23b','center')}
  if(state==='over'){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);txt('GAME OVER',W/2,240,90,'#e8383d','center');txt('STAGE '+(lvl+1)+'   SCORE '+score,W/2,305,36,'#ffd23b','center');txt('BEST '+best,W/2,345,28,'#fff','center');txt('Press Enter or tap to continue',W/2,400,24,'#fff','center')}}
 ctx.restore()}

fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));

  if(f){const r=f.call(e,{navigationUI:'hide'});if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(x){}}).catch(()=>{})}}catch(e){}}
genLevel(0);

function frame(t){requestAnimationFrame(frame);padEl.style.visibility=(state==='play'||state==='pause')?'visible':'hidden';acc+=Math.min(50,t-last);last=t;while(acc>=16.67){update();acc-=16.67}draw()}
