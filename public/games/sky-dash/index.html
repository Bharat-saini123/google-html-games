<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Dash 3D - Free 3D Arcade Runner Game</title>
<meta name="description" content="Free 3D arcade runner game. Pick one of 10 cute characters, dodge obstacles and collect coins. Play online, no download needed.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#24124d;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);border-radius:18px}
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;padding:14px;pointer-events:none}
#hud div{padding:8px 16px;font-weight:800;font-size:20px}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20px 12px;pointer-events:none}
#menu>*{pointer-events:auto}
h1{margin:0;font-size:clamp(30px,8vw,52px);letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,#2de2ff,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.sub{margin:4px 0 0;text-align:center;opacity:.85;font-size:14px}
#bot{width:100%;max-width:520px;text-align:center}
#worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.wd span{font-size:20px!important}.wd{padding:5px 2px!important}
#chars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.ch{border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 2px;cursor:pointer;font:inherit}
.ch span{display:block;font-size:26px}
.ch em{font-style:normal;font-size:11px;font-weight:700}
.ch.on{border:2px solid #ffd84d;background:rgba(255,216,77,.28);transform:translateY(-3px)}
.go{font:inherit;font-weight:900;font-size:20px;border:none;border-radius:999px;padding:14px 44px;color:#fff;background:linear-gradient(90deg,#ff4fa3,#7c5cff);box-shadow:0 6px 24px rgba(124,92,255,.6);cursor:pointer}
.go.alt{background:rgba(255,255,255,.18);box-shadow:none;margin-left:8px}
#lv{position:fixed;top:22%;left:0;right:0;text-align:center;font-size:clamp(24px,7vw,40px);font-weight:900;white-space:pre;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 3px 16px #000a}
small{display:block;margin-top:10px;opacity:.75;font-size:12px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,5,30,.55)}
#over .glass{padding:26px 30px;text-align:center;max-width:90vw}
#over h2{margin:0 0 8px;font-size:32px}
#over p{margin:4px 0;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="glass" id="sc">0</div><div class="glass" id="co">🪙 0</div></div>
<div id="lv"></div>
<div id="menu">
  <div><h1>SKY DASH 3D</h1><p class="sub">Choose your world &amp; hero</p></div>
  <div id="bot">
    <div id="worlds"></div>
    <div id="chars"></div>
    <button class="go" id="play">▶ PLAY</button>
    <small>Swipe ← → to move • swipe ↑ or tap to JUMP • swipe ↓ to SLIDE<br>Keyboard: ← → / A D move • ↑ W Space jump • ↓ S slide<br>🟥 jump over &nbsp; 🟧 slide under &nbsp; 🟪 go around</small>
  </div>
</div>
<div id="over"><div class="glass"><h2>Oops! 💥</h2><p id="os"></p><p id="ob"></p><br>
  <button class="go" id="again">Play Again</button><button class="go alt" id="back">Heroes</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CH=[
{n:'Kitty',i:'🐱',c:0xf2a65a,b:0xfff0dc,ie:0xff9db5,s:0xfff0dc,ear:'cone',tail:'long'},
{n:'Foxy',i:'🦊',c:0xe8591f,b:0xffffff,ie:0xffffff,s:0x3a2a2a,ear:'cone',tail:'fluffy'},
{n:'Bunny',i:'🐰',c:0xf3f0f5,b:0xffffff,ie:0xffb3c9,ear:'long',tail:'ball'},
{n:'Panda',i:'🐼',c:0xffffff,b:0xffffff,ie:0x222222,s:0x222222,a:0x222222,ear:'round',p:1},
{n:'Teddy',i:'🐻',c:0x9c6b3f,b:0xe3b88a,ie:0xe3b88a,s:0x7a4f2b,ear:'round',tail:'ball'},
{n:'Froggy',i:'🐸',c:0x58c85a,b:0xe8ffc0,fr:1},
{n:'Pengu',i:'🐧',c:0x25335c,b:0xffffff,s:0xff9f1c,beak:1},
{n:'Robo',i:'🤖',c:0xb8c4d0,b:0x5ad1ff,s:0x6c7a89,box:1,ant:1,metal:1},
{n:'Zorp',i:'👽',c:0x9a78ff,b:0xcfc0ff,al:1,ant:2},
{n:'Ducky',i:'🦆',c:0xffe14d,b:0xfff3a8,s:0xff9f1c,beak:1,tail:'ball'}
];
const $=id=>document.getElementById(id),T=THREE,LX=[-2,0,2];
let ac;function beep(f,d=.1,v=.12){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function coinSnd(n){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
  const tone=(f,d,v,len,ty)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;
    g.gain.setValueAtTime(.001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+.004);g.gain.exponentialRampToValueAtTime(.001,t+d+len);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+len+.02)};
  tone(1568,0,.11,.07,'square');tone(2349,.055,.12,.2,'square');tone(4698,.055,.04,.12,'sine');tone(3136,.055,.04,.15,'triangle')}catch(e){}}
// renderer & scene
const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const sc=new T.Scene();sc.background=new T.Color(0x24124d);sc.fog=new T.Fog(0x24124d,18,80);
const cam=new T.PerspectiveCamera(60,1,.1,150);
const hemi=new T.HemisphereLight(0xbfa8ff,0x2a1a55,1.15);sc.add(hemi);
const dl=new T.DirectionalLight(0xffffff,.9);dl.position.set(3,8,5);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});sc.add(dl);
const rim=new T.DirectionalLight(0xff7ad9,.7);rim.position.set(-3,4,-8);sc.add(rim);
const Mt=(c,e)=>new T.MeshStandardMaterial({color:c,roughness:.5,emissive:e||0,emissiveIntensity:.4});
const box=(w,h,d,mat,x,y,z)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);sc.add(o);return o};
const track=box(6.4,.4,220,Mt(0x3b2a8a),0,-.2,-90);track.receiveShadow=true;
const ground=new T.Mesh(new T.PlaneGeometry(260,260),new T.MeshStandardMaterial({color:0x150a30,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.45,-80);ground.receiveShadow=true;sc.add(ground);
const edges=[-3.3,3.3].map(x=>box(.15,.3,220,new T.MeshBasicMaterial({color:0x2de2ff}),x,0,-90));
const sun=new T.Mesh(new T.SphereGeometry(16,32,24),new T.MeshBasicMaterial({color:0xff6fb5,fog:false}));sun.position.set(0,14,-120);sc.add(sun);
const dash=[];for(let i=0;i<24;i++)[-1,1].forEach(x=>dash.push(box(.12,.02,1.6,new T.MeshBasicMaterial({color:0x8fdcff}),x,.01,-i*5)));
const dec=[];
function rePos(o,z){o.position.x=(Math.random()<.5?-1:1)*(6+Math.random()*9);o.position.z=z}
function buildDec(t){
  dec.forEach(o=>sc.remove(o));dec.length=0;
  for(let i=0;i<24;i++){const col=t.dc[i%t.dc.length];let o;
    if(t.tree){o=new T.Group();const h=1.5+Math.random()*1.5;
      const tr=new T.Mesh(new T.CylinderGeometry(.15,.2,h*.5),Mt(0x7a4f2b));tr.position.y=h*.25;o.add(tr);
      for(let j=0;j<3;j++){const c=new T.Mesh(new T.ConeGeometry(1.1-j*.25,1.3,8),Mt(col));c.position.y=h*.5+.5+j*.7;o.add(c);
        if(t.snow){const cp=new T.Mesh(new T.ConeGeometry(.55-j*.12,.5,8),Mt(0xffffff));cp.position.y=h*.5+.9+j*.7;o.add(cp)}}
      o.scale.setScalar(1+Math.random());o.position.y=-.4;sc.add(o)}
    else{const w=1+Math.random()*2.5,h=w*(1+Math.random()*2.5);o=box(w,h,w,Mt(col,t.em?col:0),0,h/2-.3,0)}
    rePos(o,-i*4);dec.push(o)}
}
const TH={
 day:{n:'Day',i:'☀️',bg:0x8fd3ff,tr:0x6b7794,ed:0xffffff,da:0xffffff,gr:0x6cc04a,su:0xfff1a8,sp:[25,16,-120],ss:.6,h:[0xffffff,0x7aa65a,1.25],rim:0xffe9a8,ri:.3,dc:[0x3fae49,0x58c85a,0x2e9a3f],tree:1},
 sunset:{n:'Sunset',i:'🌅',bg:0xff9a6b,tr:0x4a3a6a,ed:0xffd84d,da:0xffe9c2,gr:0x3a2150,su:0xff5f6d,sp:[0,10,-120],ss:1,h:[0xffd1a8,0x4a2a5a,1.1],rim:0xff9ad5,ri:.7,dc:[0xffb347,0xff6f91,0x845ec2,0xffc75f]},
 night:{n:'Night',i:'🌙',bg:0x24124d,tr:0x3b2a8a,ed:0x2de2ff,da:0x8fdcff,gr:0x150a30,su:0xff6fb5,sp:[0,14,-120],ss:1,h:[0xbfa8ff,0x2a1a55,1.15],rim:0xff7ad9,ri:.7,dc:[0xff4fa3,0x2de2ff,0xffd84d,0x7c5cff],em:1},
 snow:{n:'Snow',i:'❄️',bg:0xcfe8ff,tr:0x9fb4d0,ed:0x7fd4ff,da:0xffffff,gr:0xf4faff,su:0xfff6d5,sp:[-20,16,-120],ss:.6,h:[0xffffff,0xaaccee,1.3],rim:0xaad4ff,ri:.4,dc:[0x2f7d5b,0x3b9470],tree:1,snow:1}
};
function applyWorld(k){
  if(!TH[k])k='day';world=k;const t=TH[k];
  sc.background.set(t.bg);sc.fog.color.set(t.bg);hemi.color.set(t.h[0]);hemi.groundColor.set(t.h[1]);hemi.intensity=t.h[2];
  rim.color.set(t.rim);rim.intensity=t.ri;track.material.color.set(t.tr);edges.forEach(e=>e.material.color.set(t.ed));
  dash.forEach(d=>d.material.color.set(t.da));ground.material.color.set(t.gr);sun.material.color.set(t.su);sun.position.set(...t.sp);sun.scale.setScalar(t.ss);
  buildDec(t);[...$('worlds').children].forEach((b,i)=>b.classList.toggle('on',Object.keys(TH)[i]===k));
  try{localStorage.setItem('sd_w',k)}catch(e){}
}

// characters
function mk(d){
  const g=new T.Group(),S=r=>new T.SphereGeometry(r,24,18),mt=d.metal?.3:.8,mm=d.metal?.7:0;
  const add=(geo,c,x,y,z,sx=1,sy=1,sz=1,p=g,o={})=>{const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:c,roughness:o.r??mt,metalness:o.m??mm,emissive:o.em??0,emissiveIntensity:o.em?1:0}));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;p.add(m);return m};
  add(S(.36),d.c,0,.78,0,1,1.25,.85);
  add(S(.3),d.b,0,.74,.1,1,1.2,.55);
  const H=new T.Group();H.position.set(0,1.42,0);g.add(H);g.head=H;
  if(d.box)add(new T.BoxGeometry(.72,.56,.6),d.c,0,0,0,1,1,1,H);else add(S(.37),d.c,0,0,0,1.08,.95,1,H);
  if(d.ear){add(S(.15),d.b,0,-.1,.3,1.1,.8,1,H);add(S(.045),0x2a1a1a,0,-.06,.43,1,.8,.8,H,{r:.3})}
  if(d.beak)add(S(.12),0xff9f1c,0,-.08,.36,1.1,.5,1.1,H,{r:.4});
  if(d.ant===1){add(new T.CylinderGeometry(.015,.015,.3),d.s,0,.42,0,1,1,1,H);add(S(.07),0xff4f6d,0,.6,0,1,1,1,H,{em:0xff2f55})}
  [-1,1].forEach(s=>{
    if(d.al){const e=add(S(.12),0x0b0b12,s*.17,.04,.3,1,1.4,.55,H,{r:.1});e.rotation.z=-s*.4;add(S(.025),0xffffff,s*.17+.03,.1,.38,1,1,1,H,{r:.1});
      add(new T.CylinderGeometry(.015,.015,.3),d.c,s*.18,.5,0,1,1,1,H);add(S(.06),0xffee55,s*.18,.67,0,1,1,1,H,{em:0xffcc33})}
    else if(d.box)add(S(.085),0x2de2ff,s*.17,.04,.3,1,1,.5,H,{em:0x2de2ff,r:.2});
    else{const ex=d.fr?.22:.16,ey=d.fr?.32:.06,ez=d.fr?.21:.31;
      if(d.fr)add(S(.14),d.c,s*.22,.3,.1,1,1,1,H);
      if(d.p)add(S(.11),0x1c1c1c,s*.16,.05,.3,1,1.3,.5,H);
      add(S(.085),0xffffff,s*ex,ey,ez,1,1,.6,H,{r:.2});
      add(S(.055),0x0b0b0b,s*ex,ey,ez+.045,1,1,.6,H,{r:.1});
      add(S(.02),0xffffff,s*ex+.02,ey+.025,ez+.085,1,1,1,H,{r:.1})}
    if(d.ear==='cone'){add(new T.ConeGeometry(.14,.34,16),d.c,s*.23,.4,-.02,1,1,.7,H).rotation.z=-s*.18;add(new T.ConeGeometry(.08,.22,16),d.ie,s*.23,.38,.03,1,1,.5,H).rotation.z=-s*.18}
    if(d.ear==='long'){add(S(.1),d.c,s*.15,.62,-.02,1,3.2,.6,H).rotation.z=-s*.12;add(S(.06),d.ie,s*.15,.62,.03,1,2.6,.4,H).rotation.z=-s*.12}
    if(d.ear==='round'){add(S(.14),d.s,s*.28,.3,-.02,1,1,.7,H);add(S(.08),d.ie,s*.28,.3,.04,1,1,.5,H)}
  });
  g.arms=[-1,1].map(s=>{const a=new T.Group();a.position.set(s*.38,1.02,0);g.add(a);
    add(S(.1),d.a??d.c,0,-.2,0,1,2.2,1,a);add(S(.095),d.s??d.a??d.c,0,-.42,.02,1,1,1,a);a.rotation.z=s*.15;return a});
  g.legs=[-1,1].map(s=>{const l=new T.Group();l.position.set(s*.16,.5,0);g.add(l);
    add(S(.12),d.a??d.c,0,-.18,0,1,1.8,1,l);add(S(.13),d.s??d.a??d.c,0,-.4,.07,1,.6,1.5,l);return l});
  if(d.tail){const t=new T.Group();t.position.set(0,.55,-.28);g.add(t);g.tail=t;
    if(d.tail==='ball')add(S(.13),d.b,0,.05,-.1,1,1,1,t);
    else if(d.tail==='long')add(S(.08),d.c,0,.15,-.3,1,1,3.5,t);
    else{add(S(.15),d.c,0,.08,-.25,.8,.8,2.2,t);add(S(.12),0xffffff,0,.08,-.58,.9,.9,1,t)}}
  return g;
}
function anim(run,sl){
  const w=Math.sin(tm*13),k=run&&!sl?.9:0;
  hero.legs.forEach((l,i)=>l.rotation.x=(i?w:-w)*k);
  hero.arms.forEach((a,i)=>a.rotation.x=(i?-w:w)*k*.9);
  if(hero.tail)hero.tail.rotation.y=Math.sin(tm*(run?9:4))*.45;
  hero.head.rotation.y=run?0:Math.sin(tm*1.5)*.15;
}

// state
let st='menu',sel=0,hero,speed=11,dist=0,coins=0,lane=1,px=0,y=0,vy=0,spawnT=0,best=0,tm=0,slideT=0,L=1,world='day';
const obs=[],cns=[],look=new T.Vector3(0,.5,0);
try{sel=+localStorage.getItem('sd_c')||0;best=+localStorage.getItem('sd_b')||0;world=localStorage.getItem('sd_w')||'day'}catch(e){}
function setHero(i){
  if(hero)sc.remove(hero);sel=i;hero=mk(CH[i]);sc.add(hero);hero.scale.setScalar(st==='menu'?1.35:1);
  [...$('chars').children].forEach((b,k)=>b.classList.toggle('on',k===i));
  try{localStorage.setItem('sd_c',i)}catch(e){}beep(600,.06);
}
CH.forEach((c,i)=>{const b=document.createElement('button');b.className='ch glass';b.innerHTML=`<span>${c.i}</span><em>${c.n}</em>`;b.onclick=()=>setHero(i);$('chars').appendChild(b)});
setHero(sel);
Object.keys(TH).forEach(k=>{const b=document.createElement('button');b.className='ch wd glass';b.innerHTML=`<span>${TH[k].i}</span><em>${TH[k].n}</em>`;b.onclick=()=>{applyWorld(k);beep(600,.06)};$('worlds').appendChild(b)});
applyWorld(world);

function reset(){
  [...obs,...cns].forEach(o=>sc.remove(o));obs.length=cns.length=0;
  speed=11;dist=0;coins=0;lane=1;px=0;y=0;vy=0;spawnT=6;slideT=0;L=1;
  hero.rotation.set(0,0,0);hero.scale.setScalar(1);hud();
}
function start(){reset();hero.rotation.y=Math.PI;st='play';$('menu').style.display='none';$('over').style.display='none';$('hud').style.display='flex';beep(520,.1);}
const LV=()=>Math.min(12,1+Math.floor((dist+coins*10)/100));
function hud(){$('sc').textContent=(Math.floor(dist)+coins*10)+'  •  Lv '+LV();$('co').textContent='🪙 '+coins}
const MSG={3:'🟥 Wide barrier: JUMP!',4:'🟧 Orange gate: SLIDE under!',5:'🟪 Purple wall: change lane!',6:'Combos! Stay sharp'};
function banner(t){const e=$('lv');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1800)}
function crash(){
  st='over';beep(120,.5,.2);hero.rotation.x=-1.3;
  const s=Math.floor(dist)+coins*10;if(s>best){best=s;try{localStorage.setItem('sd_b',best)}catch(e){}}
  $('os').textContent='Score: '+s+'  •  Coins: '+coins;$('ob').textContent='Best: '+best;
  setTimeout(()=>$('over').style.display='flex',500);
}
const ob=(w,h,yb,x,col,t)=>{const m=box(w,h,1,Mt(col,col),x,yb+h/2,-75);m.userData={t,w};obs.push(m)};
function coinsAt(l,yy,n=4){for(let j=0;j<n;j++){const c=new T.Mesh(new T.CylinderGeometry(.35,.35,.1,20),Mt(0xffd84d,0xaa7700));c.rotation.x=Math.PI/2;c.position.set(LX[l],yy,-75-j*1.8);sc.add(c);cns.push(c)}}
function spawn(){
  const L2=LV(),p=['low1'];
  if(L2>=2)p.push('low2');if(L2>=3)p.push('jump');if(L2>=4)p.push('gate');if(L2>=5)p.push('wall');if(L2>=6)p.push('wall','gate','jump');
  const k=p[Math.floor(Math.random()*p.length)],l=[0,1,2].sort(()=>Math.random()-.5);
  if(k==='low1'){ob(1.5,1.1,0,LX[l[0]],0xff4f6d,'low');coinsAt(l[1],.9)}
  else if(k==='low2'){ob(1.5,1.1,0,LX[l[0]],0xff4f6d,'low');ob(1.5,1.1,0,LX[l[1]],0xff4f6d,'low');coinsAt(l[2],.9)}
  else if(k==='jump'){ob(6.2,1.1,0,0,0xff4f6d,'low');coinsAt(1,2.1,3)}
  else if(k==='gate'){ob(6.2,2.3,.85,0,0xffa21f,'gate');coinsAt(l[0],.9)}
  else{ob(1.5,3.2,0,LX[l[0]],0xb04fff,'tall');ob(1.5,3.2,0,LX[l[1]],0xb04fff,'tall');coinsAt(l[2],.9)}
}
const mv=d=>{if(st==='play'){lane=Math.max(0,Math.min(2,lane+d));beep(480,.05)}};
const jump=()=>{if(st==='play'&&y<.05){vy=10;slideT=0;beep(720,.08)}};
const slide=()=>{if(st==='play'){if(y>.05)vy=-20;slideT=.8;beep(300,.1)}};
addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')mv(-1);else if(k==='ArrowRight'||k==='d'||k==='D')mv(1);
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' '){e.preventDefault();jump()}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();slide()}});
let t0;addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(st!=='play'||!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy>30)slide();else jump()},{passive:true});
$('play').onclick=start;$('again').onclick=start;
$('back').onclick=()=>{st='menu';$('over').style.display='none';$('hud').style.display='none';$('menu').style.display='flex';reset();hero.scale.setScalar(1.35)};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<.8?76:60;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new T.Clock(),tgtP=new T.Vector3(),tgtL=new T.Vector3();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);tm+=dt;
  const v=st==='play'?speed:4;
  if(st==='play'){
    speed=Math.min(30,11+dist/100);dist+=speed*dt*.5;slideT-=dt;const sl=slideT>0;
    spawnT-=speed*dt;if(spawnT<=0){spawn();spawnT=speed*.9+5+Math.random()*4;if(LV()>=6&&Math.random()<.3)spawnT=speed*.9+3}
    px+=(LX[lane]-px)*Math.min(1,12*dt);
    y+=vy*dt;vy-=28*dt;if(y<=0){y=0;vy=0}
    hero.position.set(px,y+(sl?.5:(y===0?Math.abs(Math.sin(tm*13))*.07:0)),0);
    hero.rotation.x+=((sl?-Math.PI/2:0)-hero.rotation.x)*Math.min(1,16*dt);
    hero.rotation.z=(LX[lane]-px)*.25;
    anim(true,sl);
    for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.position.z+=v*dt;
      const u=o.userData;
      if(Math.abs(o.position.z)<.9&&Math.abs(o.position.x-px)<u.w/2+.3&&(u.t==='tall'||(u.t==='low'&&y<1.05)||(u.t==='gate'&&(!sl||y>.3)))){crash();break}
      if(o.position.z>8){sc.remove(o);obs.splice(i,1)}}
    for(let i=cns.length-1;i>=0;i--){const c=cns[i];c.position.z+=v*dt;c.rotation.z+=dt*4;
      if(Math.abs(c.position.z)<.9&&Math.abs(c.position.x-px)<1&&Math.abs(c.position.y-(y+(sl?.45:.9)))<1.1){sc.remove(c);cns.splice(i,1);coins++;coinSnd(coins);hud();continue}
      if(c.position.z>8){sc.remove(c);cns.splice(i,1)}}
    hud();const nl=LV();if(nl>L){L=nl;banner('LEVEL '+L+(MSG[L]?'\n'+MSG[L]:'\nFaster!'))}
  }else if(st==='menu'){hero.rotation.y+=dt*1.2;hero.position.set(0,Math.sin(tm*2)*.05,0);anim(false,false)}
  dash.forEach(d=>{d.position.z+=v*dt;if(d.position.z>8)d.position.z-=120});
  dec.forEach(o=>{o.position.z+=v*dt;o.rotation.y+=dt*.2;if(o.position.z>12)rePos(o,-90-Math.random()*10)});
  if(st==='menu'){tgtP.set(0,1.6,5);tgtL.set(0,.5,0)}else{tgtP.set(0,3.6,5.8);tgtL.set(0,1,-6)}
  const k=1-Math.exp(-4*dt);cam.position.lerp(tgtP,k);look.lerp(tgtL,k);cam.lookAt(look);
  R.render(sc,cam);
})();
</script>
</body>
</html>
