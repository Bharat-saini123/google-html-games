function mkCar(color){const g=new T.Group(),b=new T.Group();g.add(b);

 if(state==='count'){cd-=dt;const n=Math.ceil(cd);if(n!==lastN&&n>0&&n<4){banner(n);beep(440);lastN=n}if(cd<=0){state='race';banner('GO!');beep(880)}}
 if(state==='race'||state==='done'){if(state==='race')raceT+=dt;

   else ai(c,dt)});
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);

  cars.forEach(c=>{near(c);const i=c.idx;

   if(c.grass&&Math.abs(c.f)>8&&Math.random()<.5)part(c.x-Math.sin(c.h)*1.5,.3,c.z-Math.cos(c.h)*1.5,rn()*2,1.5,rn()*2,.7,0x6a5a3a,.5,1.5,false);
   if(c.lap>LAPS&&!c.fin){c.fin=raceT||1;finOrder.push(c);if(c.isP){state='done';const pp=finOrder.length;banner(ord(pp)+' PLACE!');setTimeout(()=>{$('ovt').innerHTML=(pp===1?'🏆 YOU WON! ':'🏁 Race finished! ')+'You finished in <b>'+ord(pp)+'</b> place.<br>Time: <b>'+fmt(c.fin)+'</b>';$('go').textContent='RACE AGAIN 🏁';$('ov').style.display='flex'},2200)}}});
  const rk=[...cars].sort((a,b)=>(b.fin?1e9-b.fin:b.prog)-(a.fin?1e9-a.fin:a.prog)),ps=rk.indexOf(pl)+1;
  $('pos').innerHTML=ps+'<small>/6</small>';$('lap').textContent=Math.min(LAPS,Math.max(1,pl.lap));$('time').textContent=fmt(raceT);
 }
 if(state!=='menu'&&state!=='over'&&pl&&(state!=='done'||true)&&$('ov').style.display==='none'||state==='done'){
  const sp=Math.abs(pl.f);camH+=ad(pl.h-camH)*dt*4;const cx=Math.sin(camH),cz=Math.cos(camH),nt=K.ShiftLeft&&nitro>1;

 else{const a=t/5000,q=PT[N-8];cam.position.set(q.x+Math.cos(a)*26,9,q.z+Math.sin(a)*26);cam.lookAt(q.x,1,q.z);if(eo)eo.frequency.value=0;

 cars.forEach(c=>{c.g.position.set(c.x,0,c.z);c.g.rotation.y=c.h;c.lean=(c.lean||0)+((-(c.str||0)*Math.min(1,Math.abs(c.f)/22)*.62)-(c.lean||0))*Math.min(1,dt*7);c.b.rotation.z=c.lean;c.b.rotation.x=cl(-(c.acc||0)*.0008,-.05,.05);

 for(const p of P)if(p.on){p.life-=dt;if(p.life<=0){p.on=false;p.m.visible=false;continue}p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.1,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;p.vy-=4*dt;p.vx*=.97;p.vz*=.97;
  const k=p.life/p.max;p.m.scale.setScalar(p.size+p.grow*(1-k));p.m.material.opacity=k}
 shake=Math.max(0,shake-dt*2.2);
 mx.clearRect(0,0,260,260);mx.drawImage(mbg,0,0);cars.forEach(c=>{const q=mp(c.x,c.z);mx.fillStyle=c.isP?'#ff2e4a':'#4aa8ff';mx.beginPath();mx.arc(q[0],q[1],c.isP?9:6,0,6.3);mx.fill()});
 R.render(S,cam);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
